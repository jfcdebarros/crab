<title>crab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra preta da marca (logo, navegação, parâmetros) sobre conteúdo claro/escuro; cada aba abre com um cabeçalho curto e blocos com uma informação principal por linha e o detalhe em segundo plano */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --surface-2:#faf9f7; --raise:#f1efec;
  --line:#e6e2dd; --line-2:#efece8;
  --fg:#121110; --fg-2:#3a3632; --muted:#6e6862; --faint:#a39c94;
  --crab:#e5482b; --crab-ink:#b2341b; --crab-soft:#fce9e3;
  --pos:#127a4b; --pos-soft:#e3f2e9; --neg:#b4234d; --neg-soft:#f8e3e9; --warn:#985a00; --warn-soft:#fbefd8;
  --hdr:#0b0b0c; --hdr-fg:#f5f3f0; --hdr-muted:#9c968f; --hdr-line:#242220; --hdr-field:#171615;
  --shadow:0 1px 2px rgba(18,17,16,.05),0 10px 30px rgba(18,17,16,.07);
  --scrim:rgba(11,11,12,.38);
  --display:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#141312; --surface-2:#100f0e; --raise:#1c1a18;
  --line:#272422; --line-2:#1e1c1a;
  --fg:#f4f1ee; --fg-2:#cfc9c2; --muted:#958e87; --faint:#625c56;
  --crab:#ff6342; --crab-ink:#ff8c70; --crab-soft:#2d1710;
  --pos:#3dd68c; --pos-soft:#0f2519; --neg:#ff6f93; --neg-soft:#2b1119; --warn:#f2b54e; --warn-soft:#2a2010;
  --hdr:#0b0b0c; --hdr-line:#242220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#141312; --surface-2:#100f0e; --raise:#1c1a18;
  --line:#272422; --line-2:#1e1c1a;
  --fg:#f4f1ee; --fg-2:#cfc9c2; --muted:#958e87; --faint:#625c56;
  --crab:#ff6342; --crab-ink:#ff8c70; --crab-soft:#2d1710;
  --pos:#3dd68c; --pos-soft:#0f2519; --neg:#ff6f93; --neg-soft:#2b1119; --warn:#f2b54e; --warn-soft:#2a2010;
  --hdr:#0b0b0c; --hdr-line:#242220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--crab-ink);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--crab);outline-offset:2px;border-radius:4px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- barra da marca ----------
   Três faixas simétricas: (1) parâmetros · marca centralizada · cotações; (2) abas centralizadas; (3) a faixa preta com a ponta vermelha e os graus, como a faixa do caranguejo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:var(--hdr-fg);background:var(--hdr)}
.hdr-top{position:relative;overflow:hidden;background:
  radial-gradient(420px 150px at 50% 115%,rgba(229,72,43,.30),transparent 70%),
  radial-gradient(900px 120px at 50% 120%,rgba(229,72,43,.10),transparent 75%),var(--hdr)}
.hdr-in{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"params brand right";align-items:center;column-gap:20px;height:78px}
.brand{grid-area:brand;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brand svg{display:block;flex:none;filter:drop-shadow(0 6px 14px rgba(229,72,43,.35));transition:transform .25s ease}
.brand:hover svg{transform:rotate(-6deg) translateY(-1px)}
.bt{display:grid;gap:3px;text-align:left}
.word{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.05em;line-height:.9;color:var(--hdr-fg)}
.word b{color:var(--crab);font-weight:700}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--hdr-muted);white-space:nowrap}
.params{grid-area:params;display:flex;align-items:center;gap:8px;justify-self:start}
.right{grid-area:right;display:flex;align-items:center;gap:8px;justify-self:end}
.pfield{display:flex;align-items:center;gap:4px;height:38px;padding:0 6px 0 12px;border:1px solid var(--hdr-line);border-radius:999px;background:rgba(255,255,255,.035)}
.pfield label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--hdr-muted);white-space:nowrap}
.pfield input{width:70px;border:0;background:transparent;font-family:var(--mono);font-size:13.5px;text-align:right;padding:4px;color:var(--hdr-fg);font-variant-numeric:tabular-nums}
.pfield input:focus{outline:none}
.pfield .u{font-family:var(--mono);font-size:12px;color:var(--hdr-muted);padding-right:6px}
.pfield:focus-within{border-color:var(--crab);box-shadow:0 0 0 3px rgba(229,72,43,.18)}
.pxbtn{display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 16px 0 14px;border-radius:999px;border:0;background:linear-gradient(180deg,#f0593a,#d83f22);color:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 6px 18px rgba(229,72,43,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.pxbtn:hover{filter:brightness(1.07)}
.pxbtn .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.55}
.pxbtn .dot.live{opacity:1;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.nav{background:#121110;border-top:1px solid var(--hdr-line);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:4px;justify-content:center;min-width:max-content;margin:0 auto;padding:7px 16px}
.tab{position:relative;height:34px;padding:0 14px;border:0;border-radius:999px;background:none;cursor:pointer;color:var(--hdr-muted);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--hdr-fg);background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{color:#fff;background:var(--crab);box-shadow:0 4px 14px rgba(229,72,43,.35)}
.tab .ct{font-family:var(--mono);font-size:10.5px;min-width:18px;text-align:center;padding:1px 5px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--hdr-muted)}
.tab[aria-selected="true"] .ct{background:rgba(255,255,255,.22);color:#fff}
.belt{position:relative;height:9px;background:
  linear-gradient(#2a2725,#2a2725) 0 3px/100% 1px no-repeat,
  linear-gradient(#2a2725,#2a2725) 0 6px/100% 1px no-repeat,#0e0e0f;border-top:1px solid #000;border-bottom:1px solid #000}
.belt i{position:absolute;top:0;bottom:0;left:50%;width:150px;transform:translateX(-50%);background:#d62f2a;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.belt i::before,.belt i::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:#0e0e0f}
.belt i::before{left:-4px}.belt i::after{right:-4px}
.belt b{position:absolute;top:0;bottom:0;left:50%;width:58px;transform:translateX(-50%);background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 17.3px)}
@media (max-width:980px){
  .hdr-in{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand right" "params params";height:auto;padding-top:10px;padding-bottom:10px;row-gap:10px}
  .params{justify-self:stretch;justify-content:center;min-width:0}
  .tabs{justify-content:flex-start}
}
@media (max-width:600px){
  .word{font-size:28px}.tag{display:none}.brand svg{width:50px;height:45px}
  .params{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:100%}.pfield{min-width:0;width:100%;justify-content:space-between;padding:0 10px 0 12px}.pfield label{flex:none}.pfield input{flex:1 1 0;min-width:0;width:0;font-size:16px;-webkit-appearance:none;appearance:none}.pfield .u{padding-right:0}
  .tab{padding:0 11px;font-size:13px}
}

/* ---------- conteúdo ---------- */
main{max-width:1360px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:20px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.phead h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.phead .lede{margin:6px 0 0;color:var(--muted);max-width:68ch;font-size:13.5px}
.stamp{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stamp span{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.stamp b{font-weight:500;color:var(--fg-2);font-family:var(--mono);font-size:11.5px}
.stamp .live{width:6px;height:6px;border-radius:50%;background:var(--crab)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 12px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.card-h .hint{font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--crab-ink);font-size:12.5px;font-weight:500}
.link:hover{text-decoration:underline}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpi{padding:16px 18px;min-width:0;display:grid;gap:6px;align-content:start;border-left:1px solid var(--line-2)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v.pos{color:var(--pos)}
.kpi .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;background:none;border:0;padding:0}
.kpi button.s{cursor:pointer;color:var(--fg-2)} .kpi button.s:hover{color:var(--crab-ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px;min-width:0}

/* segmentos */
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--raise);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .ct{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* linhas de lista */
.list{display:grid}
.row{display:grid;align-items:center;gap:16px;padding:13px 18px;border-top:1px solid var(--line-2);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--crab);outline-offset:-2px}
.row.static{cursor:default} .row.static:hover{background:none}
.r-main{min-width:0}
.r-title{font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.chev{color:var(--faint);justify-self:end}
.row:hover .chev{color:var(--crab)}

.rank .row{grid-template-columns:minmax(0,1fr) auto 128px}
.ev .row{grid-template-columns:minmax(0,1.5fr) 150px 150px 132px minmax(0,1fr) 14px}
.ev .row.watch{grid-template-columns:minmax(0,1.5fr) 150px minmax(0,1fr) 14px}
.mini .row{grid-template-columns:minmax(0,1fr) 112px 64px}

.tk{font-family:var(--mono);font-size:12px;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--raise);color:var(--fg-2);white-space:nowrap}
.pair{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pair .ar{color:var(--faint);font-size:12px}
.vals{display:grid;gap:2px;justify-items:end;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.vals .l{font-family:var(--sans);font-size:11px;color:var(--faint);margin-right:6px}
.vals .b{color:var(--fg)}
.vals .m{color:var(--muted)}
.cat{display:flex;align-items:flex-start;gap:10px;min-width:0}
.cat .tx{font-size:12.5px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--raise);color:var(--fg-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.active{background:var(--raise);color:var(--fg-2)}
.chip.active::before{background:var(--crab)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.watch{color:var(--muted)}
.chip.plain::before{display:none}
.meta{display:flex;align-items:center;gap:6px;margin-top:5px;min-width:0;flex-wrap:wrap}
.meta .k{font-size:12px;color:var(--muted)}

.sp{display:grid;justify-items:end;gap:3px}
.sp .top{display:flex;align-items:center;gap:8px}
.sp .num{font-weight:600;font-size:14px}
.sp.lg .num{font-size:16px}
.sp.pos .num{color:var(--pos)} .sp.neg .num{color:var(--neg)} .sp.na .num{color:var(--faint);font-weight:400;font-size:12.5px}
.sp .sub{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.meter{width:40px;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;flex:none}
.meter i{position:absolute;top:0;bottom:0;left:0;border-radius:2px;background:var(--fg-2)}
.sp.pos .meter i{background:var(--pos)} .sp.neg .meter i{background:var(--neg)} .sp.disc .meter i{background:var(--crab)}
.cd{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--raise);color:var(--fg-2);white-space:nowrap;flex:none}
.cd.hot{background:var(--warn-soft);color:var(--warn)}

/* holdings */
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px;cursor:pointer;text-align:left;width:100%}
.hcard:hover{border-color:var(--faint)}
.hcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hcard h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--raise);position:relative;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--crab)}
.bar b{position:absolute;top:-4px;width:2px;height:14px;background:var(--fg);border-radius:1px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);letter-spacing:.02em}
.kv strong{font-family:var(--mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hedge{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg-2);padding-top:12px;border-top:1px solid var(--line-2);flex-wrap:wrap}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 16px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
td .t1{font-weight:500;color:var(--fg)}
td .t2{font-size:12px;color:var(--muted);margin-top:2px}
td .t2.wrap{white-space:normal;max-width:260px}
.dir{font-size:12px;color:var(--fg-2)}
.inl{width:86px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:0 8px;text-align:right;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.inl:focus{outline:none;border-color:var(--crab);background:var(--surface)}
.inl.set{border-color:var(--crab);color:var(--crab-ink)}
.note{font-size:12.5px;color:var(--muted);margin:0;padding:12px 18px;border-top:1px solid var(--line-2)}
.miss{font-size:12px;color:var(--warn)}

/* calendário */
.tl{display:grid}
.tl-month{padding:14px 18px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line-2)}
.tl-month:first-child{border-top:0}
.tl-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 18px}
.tl-row.click{cursor:pointer} .tl-row.click:hover{background:var(--surface-2)}
.tl-row.past{opacity:.45}
.dblock{display:grid;justify-items:center;border:1px solid var(--line);border-radius:9px;padding:4px 0 5px;background:var(--surface-2)}
.dblock b{font-family:var(--mono);font-size:17px;font-weight:500;line-height:1.1}
.dblock span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tl-row .tx{min-width:0;display:grid;gap:3px}
.tl-row .tx .w{font-size:11.5px;color:var(--muted)}
.mini .tl-row{padding:9px 18px;grid-template-columns:44px minmax(0,1fr) auto}
.mini .dblock b{font-size:15px}

/* rodapé */
.foot{max-width:1360px;margin:0 auto;padding-block:8px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;flex-wrap:wrap}
.foot .w{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.04em;color:var(--muted)}

/* ---------- painel lateral ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);z-index:50;background:var(--surface);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dh{background:var(--hdr);color:var(--hdr-fg);padding:calc(16px + env(safe-area-inset-top,0px)) 22px 16px;display:flex;gap:12px;align-items:flex-start}
